<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiSajt.com - Web Development Agency</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #7cb342;
        }
        
        p {
            font-size: 1.2rem;
            opacity: 0.8;
            line-height: 1.8;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #7cb342;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: #8dc653;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AiSajt.com</h1>
        <p>Web Development Agency</p>
        <p style="margin-top: 2rem; font-size: 1rem;">Stranica u izradi...</p>
        <a href="/" class="back-link">Nazad na početnu</a>
    </div>
</body>
</html>
